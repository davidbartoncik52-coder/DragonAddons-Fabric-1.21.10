name: Build Dragon Addons

on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -q "DragonAddons-Fabric-1.21.10-CLOUD-BUILD (1).zip" -d extracted

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build both mods
        working-directory: extracted/DragonAddons-Fabric-1.21.10
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Upload JAR files
        uses: actions/upload-artifact@v4
        with:
          name: DragonAddons-Fabric-1.21.10-JARs
          path: extracted/DragonAddons-Fabric-1.21.10/build-output/*.jar
          if-no-files-found: error
